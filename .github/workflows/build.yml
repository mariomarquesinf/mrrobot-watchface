name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrrobot-watchface-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Fetch Google's official WFF XSD validator
        run: |
          git clone --depth 1 https://github.com/google/watchface.git /tmp/watchface-tools
          cd /tmp/watchface-tools/third_party/wff
          chmod +x gradlew
          ./gradlew :specification:validator:executable-jar --stacktrace

      - name: Validate watchface.xml against the official WFF schema
        run: |
          java -jar /tmp/watchface-tools/third_party/wff/specification/validator/build/libs/wff-validator.jar \
            5 app/src/main/res/raw/watchface.xml
